name: CMMC Level 2 Compliance, Sanitization & Medallion Telemetry CI Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compliance-and-telemetry-gate:
    name: Verify RFC-5737 Sanitization, NIST 800-171 Dossier & Medallion Lakehouse
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Bootstrap Dependencies & 90-Day Synthetic Telemetry
        run: make bootstrap

      - name: Execute Medallion Lakehouse Pipeline & Policy-as-Code Gates
        run: make pipeline

      - name: Run Sanitization, Linter & Pytest Verification Audit
        run: make audit
