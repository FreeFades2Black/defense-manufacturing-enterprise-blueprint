[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "defense-manufacturing-enterprise-blueprint"
version = "1.1.0"
description = "Vendor-neutral, sanitized reference architecture and Day-1 operational execution plan for a DoD-regulated manufacturing enterprise (NIST SP 800-171 / CMMC Level 2)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0,<3.0.0",
    "streamlit>=1.30.0,<2.0.0",
    "pytest>=7.4.0,<10.0.0",
    "pyyaml>=6.0.0,<7.0.0",
]

[project.optional-dependencies]
spark = [
    "pyspark>=3.5.0",
    "delta-spark>=3.1.0",
]
dev = [
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 108
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
